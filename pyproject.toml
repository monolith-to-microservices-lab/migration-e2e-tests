[project]
name = "migration-e2e-tests"
version = "0.1.0"
description = "End-to-end test suite for the monolith -> microservices migration lab. Tests the SYSTEM, not any one service - lives in its own repo on purpose."
requires-python = ">=3.12"
dependencies = [
    "pytest>=8.2",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
    "ruff==0.16.8",
    "mypy==2.3.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "e2e: full real stack, end-to-end",
    "smoke: critical CDC path (users, sales, linked user+sale) - runs on every PR",
    "slow: takes more than a few seconds",
    "failure: chaos/failure-injection scenario - stops/starts real lab containers",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, pyupgrade
select = ["E", "W", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI/Typer declare dependencies and parameters as default-argument calls.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body", "typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.12"
files = ["tests"]
warn_unused_ignores = true
warn_redundant_casts = true
